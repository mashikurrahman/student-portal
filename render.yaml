# Render Blueprint — deploys the web service + a managed Postgres database.
# Docs: https://render.com/docs/blueprint-spec
#
# Usage: Render Dashboard → New → Blueprint → connect this repo.
# After the first deploy, set NEXTAUTH_URL to the service's public URL.

databases:
  - name: student-portal-db
    databaseName: student_portal
    user: student_portal
    plan: free

services:
  - type: web
    name: student-portal
    runtime: node
    plan: free
    # Migrations run at build time (idempotent); then the app is built.
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-portal-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false # set to the deployed URL after the first deploy
      - key: NODE_VERSION
        value: "22"
