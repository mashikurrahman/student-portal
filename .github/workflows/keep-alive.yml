# Keeps the Render free-tier web service warm by pinging its health endpoint
# on a schedule, so visitors don't hit the ~30-60s cold-start "waking up" screen.
#
# Render spins a free service down after ~15 min of no traffic; we ping every
# ~10 min to stay ahead of that. Free for public repos (GitHub-hosted runners).
#
# If your service URL changes, either edit the default below or set a repo
# variable named HEALTHCHECK_URL (Settings -> Secrets and variables -> Actions -> Variables).
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (UTC); GitHub may delay under load
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          URL: ${{ vars.HEALTHCHECK_URL || 'https://student-portal-7zw9.onrender.com/api/health' }}
        run: |
          echo "Pinging $URL"
          # Retry: the first request may itself trigger the cold start and take
          # a while, so allow generous timeouts and a few attempts.
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            --retry 5 --retry-all-errors --retry-delay 15 \
            --connect-timeout 20 --max-time 90 \
            "$URL")
          echo "HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "::error::Health check returned $code"
            exit 1
          fi
          echo "Service is awake."
